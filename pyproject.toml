[project]
name = "pdf-report-generator"
version = "0.1.0"
description = "Independent FastAPI and worker implementation for PDF report generation."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pymupdf>=1.28.2",
    "pypdf>=6.16.1",
    "pytest>=9.1.1",
    "reportlab>=5.0.1",
    "uvicorn>=0.52.4",
]
